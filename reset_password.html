{% extends 'base.html' %}
{% block title %}Atur Kata Sandi Baru - UNeed Malang{% endblock %}
{% block content %}
<section class="w-full max-w-md bg-white p-7 sm:p-8 rounded-2xl shadow-sm border border-slate-200">
    {% include 'components/flash_messages.html' %}
    <div class="text-center mb-7">
        <h1 class="text-2xl font-extrabold text-blue-700">Atur Kata Sandi Baru</h1>
        <p class="text-sm text-slate-500 mt-2">Gunakan kata sandi dengan panjang minimal 8 karakter.</p>
    </div>
    <form method="POST" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div><label for="password" class="block text-sm font-semibold text-slate-700 mb-1">Kata sandi baru</label><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm focus:border-blue-500" /></div>
        <div><label for="confirm_password" class="block text-sm font-semibold text-slate-700 mb-1">Konfirmasi kata sandi</label><input id="confirm_password" name="confirm_password" type="password" minlength="8" autocomplete="new-password" required class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm focus:border-blue-500" /></div>
        <button type="submit" class="w-full rounded-xl bg-blue-600 px-4 py-3 text-sm font-bold text-white hover:bg-blue-700">Simpan Kata Sandi</button>
    </form>
</section>
{% endblock %}
