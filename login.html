{% extends 'base.html' %}

{% block title %}Masuk - UNeed Malang{% endblock %}

{% block content %}
<div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-xl border border-slate-100">
    {% include 'components/flash_messages.html' %}
    <div class="text-center mb-8">
        <h2 class="text-2xl font-bold text-blue-600">Masuk ke UNeed Malang</h2>
        <p class="text-sm text-slate-500 mt-1">Sistem Informasi & Rekomendasi Terpadu Publik</p>
    </div>

    <form action="{{ url_for('login') }}" method="POST" class="space-y-5">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div>
            <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email Pengguna</label>
            <input type="email" id="email" name="email" required placeholder="nama@email.com"
                class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm">
        </div>

        <div>
            <div class="flex items-center justify-between mb-1">
                <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
                <a href="{{ url_for('forgot_password') }}" class="text-xs text-blue-600 hover:underline font-medium">Lupa Password?</a>
            </div>
            <input type="password" id="password" name="password" required placeholder="••••••••"
                class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm">
        </div>

        <button type="submit"
            class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-md hover:shadow-lg transition duration-200 text-sm">
            Login
        </button>
    </form>

    <div class="mt-6 text-center text-sm text-slate-600">
        Belum punya akun? 
        <a href="{{ url_for('register') }}" class="text-blue-600 font-semibold hover:underline">Daftar Akun Baru</a>
    </div>
</div>
{% endblock %}
