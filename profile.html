{% extends 'base.html' %}

{% block title %}Profil Saya - UNeed Malang{% endblock %}

{% block content %}
<div class="w-full max-w-xl mx-auto p-6 sm:p-8 bg-white rounded-2xl border border-slate-200 shadow-sm space-y-6">
    <div class="text-center space-y-2">
        <div class="mx-auto flex h-20 w-20 items-center justify-center rounded-2xl border border-blue-100 bg-blue-50 p-2">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo UNeed Malang" class="h-full w-full object-contain">
        </div>
        <h2 class="text-xl font-extrabold tracking-tight text-slate-900">Informasi Akun</h2>
        <p class="text-xs text-slate-500">{{ session.get('user', 'Akun') }}</p>
    </div>

    <div class="space-y-3 border-t border-slate-100 pt-4">
        <a href="{{ url_for('forgot_password') }}" class="block text-center py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition">
            🔑 Ganti Password
        </a>
        <form action="{{ url_for('logout') }}" method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button type="submit" class="w-full block text-center py-2.5 bg-amber-500 hover:bg-amber-600 text-white rounded-xl text-xs font-bold transition">🚪 Keluar (Log Out)</button></form>
    </div>

    <!-- Hapus Akun Permanen -->
    <div class="border-t border-red-100 pt-4">
        <form action="{{ url_for('delete_account') }}" method="POST" onsubmit="return confirm('Apakah Anda yakin ingin menghapus akun ini secara permanen? Data profil lokal Anda akan dihapus.');" class="space-y-3">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="password_confirm" class="block text-xs font-semibold text-slate-700">Konfirmasi kata sandi saat ini</label>
            <input type="password" id="password_confirm" name="password_confirm" autocomplete="current-password" required class="w-full rounded-xl border border-slate-300 px-3 py-2.5 text-sm" placeholder="Masukkan kata sandi untuk konfirmasi">
            <button type="submit" class="w-full py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-xl text-xs font-bold transition">
                🗑️ Hapus Akun Permanen
            </button>
        </form>
    </div>
</div>
{% endblock %}
