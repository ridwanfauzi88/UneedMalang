{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        <div class="space-y-2 mb-5" role="status" aria-live="polite">
            {% for category, message in messages %}
                <div class="rounded-xl border px-4 py-3 text-sm {% if category == 'danger' %}border-red-200 bg-red-50 text-red-800{% elif category == 'success' %}border-emerald-200 bg-emerald-50 text-emerald-800{% else %}border-blue-200 bg-blue-50 text-blue-800{% endif %}">{{ message }}</div>
            {% endfor %}
        </div>
    {% endif %}
{% endwith %}
