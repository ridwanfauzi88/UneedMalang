{% extends 'base.html' %}

{% block title %}Verifikasi OTP - UNeed Malang{% endblock %}

{% block content %}
<div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-xl border border-slate-100 text-center">
    <div class="mb-6">
        <h2 class="text-2xl font-bold text-blue-600">Verifikasi Kode OTP</h2>
        <p class="text-sm text-slate-500 mt-2">
            Kode 6 digit telah dikirimkan ke email: <br><strong class="text-slate-800">{{ email }}</strong>
        </p>
    </div>

    {% include 'components/flash_messages.html' %}

    <form action="{{ url_for('otp_verification') }}" method="POST" class="space-y-6">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div>
            <input type="text" id="otp" name="otp" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" required placeholder="000000"
                class="w-full text-center tracking-widest text-2xl font-bold py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
        </div>

        <button type="submit"
            class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-md hover:shadow-lg transition duration-200 text-sm">
            Verifikasi & Selesaikan Pendaftaran
        </button>
    </form>

    <div class="mt-6 text-sm text-slate-600">
        Tidak menerima kode? 
        <a href="{{ url_for('register') }}" class="text-blue-600 font-semibold hover:underline">Kirim Ulang OTP</a>
    </div>
</div>
{% endblock %}
